<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miền Tỉnh Thức · MVP01 Mobile Prototype</title>
<link rel="stylesheet" href="colors_and_type.css?v=2">
<script>
  // Apply the saved theme + language before first paint so there is no
  // flash of the wrong appearance. Defaults to Light / Vietnamese.
  try {
    var mttTheme = localStorage.getItem('mtt.theme');
    document.documentElement.dataset.theme = (mttTheme === 'dark') ? 'dark' : 'light';
    var mttLang = localStorage.getItem('mtt.lang');
    if (mttLang === 'vi' || mttLang === 'en') document.documentElement.lang = mttLang;
  } catch (e) { /* storage unavailable — keep defaults */ }
</script>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--app-gradient);
    min-height: 100vh;
    font-family: var(--font-body);
  }
  #app { min-height: 100vh; }
  /* Hide horizontal scrollbars on filter pills, etc. */
  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  /* Neutral boot loader — shown until React mounts, then replaced. No language
     text, so the correct language is always the first thing the user reads. */
  #boot-loading {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
  }
  #boot-loading img { width: 84px; height: auto; animation: boot-pulse 1.6s ease-in-out infinite; }
  #boot-loading .dot { width: 6px; height: 6px; border-radius: 50%; background: #006384; animation: boot-pulse 1.6s ease-in-out infinite; }
  @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app">
  <div id="boot-loading">
    <img src="assets/logo-mark.png" alt="Miền Tỉnh Thức" />
    <span class="dot"></span>
  </div>
</div>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-auth.jsx"></script>
<script type="text/babel" src="screens-home-events.jsx"></script>
<script type="text/babel" src="screens-talks.jsx"></script>
<script type="text/babel" src="screens-notifications.jsx"></script>
<script type="text/babel" src="screens-more-profile.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
